  <style>
    /* ========== BLOG INDEX STYLES ========== */
    
    .hero-section {
      background: linear-gradient(135deg, var(--orange) 0%, rgba(232, 96, 10, 0.8) 100%);
      padding: 60px 0;
      position: relative;
      overflow: hidden;
    }

    .hero-section::before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      top: -100px;
      right: -100px;
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .hero-content h1 {
      font-size: 2.8em;
      font-weight: 700;
      color: white;
      margin: 0 0 16px 0;
      line-height: 1.2;
    }

    .hero-content p {
      font-size: 1.15em;
      color: rgba(255, 255, 255, 0.95);
      margin: 0;
      max-width: 600px;
      line-height: 1.6;
    }

    /* ========== SEARCH BAR ========== */
    .search-section {
      padding: 40px 0;
      background: var(--bg);
    }

    .search-container {
      max-width: 600px;
      margin: 0 auto;
    }

    .search-input {
      width: 100%;
      padding: 14px 18px;
      font-size: 1em;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: var(--bg-alt);
      color: var(--text);
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(232, 96, 10, 0.1);
    }

    /* ========== MAIN CONTENT LAYOUT ========== */
    .blog-container {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 40px;
      padding: 50px 0;
    }

    @media (max-width: 1000px) {
      .blog-container {
        grid-template-columns: 1fr;
        gap: 30px;
      }
    }

    /* ========== CATEGORY NAVIGATION ========== */
    .categories-nav {
      padding: 20px 0;
      border-bottom: 1px solid var(--line);
      margin-bottom: 40px;
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .categories-nav::-webkit-scrollbar {
      height: 4px;
    }

    .categories-nav::-webkit-scrollbar-track {
      background: var(--bg-alt);
      border-radius: 10px;
    }

    .categories-nav::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 10px;
    }

    .category-btn {
      padding: 8px 16px;
      border: 2px solid var(--line);
      background: transparent;
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95em;
      white-space: nowrap;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
    }

    .category-btn:hover,
    .category-btn.active {
      border-color: var(--orange);
      color: var(--orange);
      background: rgba(232, 96, 10, 0.1);
    }

    /* ========== FEATURED POST ========== */
    .featured-post {
      background: var(--bg-alt);
      border: 2px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 50px;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      height: 380px;
    }

    @media (max-width: 800px) {
      .featured-post {
        grid-template-columns: 1fr;
        height: auto;
      }
    }

    .featured-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .featured-content {
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .featured-tag {
      display: inline-block;
      background: rgba(232, 96, 10, 0.15);
      color: var(--orange);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.85em;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      width: fit-content;
      margin-bottom: 12px;
    }

    .featured-title {
      font-size: 1.8em;
      font-weight: 700;
      line-height: 1.3;
      margin: 0 0 16px 0;
      color: var(--text);
    }

    .featured-excerpt {
      font-size: 1em;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .featured-meta {
      display: flex;
      gap: 16px;
      align-items: center;
      color: var(--muted);
      font-size: 0.95em;
    }

    .featured-link {
      display: inline-block;
      color: var(--orange);
      font-weight: 700;
      text-decoration: none;
      margin-top: auto;
      font-size: 0.95em;
      transition: all 0.3s ease;
    }

    .featured-link:hover {
      gap: 8px;
    }

    /* ========== POST GRID ========== */
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    @media (max-width: 900px) {
      .posts-grid {
        grid-template-columns: 1fr;
      }
    }

    .post-card {
      background: var(--bg-alt);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      transition: all 0.3s ease;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .post-card:hover {
      border-color: var(--orange);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      transform: translateY(-4px);
    }

    .post-thumbnail {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: var(--line);
    }

    .post-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .post-tag {
      display: inline-block;
      background: rgba(232, 96, 10, 0.1);
      color: var(--orange);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.8em;
      font-weight: 700;
      text-transform: uppercase;
      width: fit-content;
    }

    .post-title {
      font-size: 1.2em;
      font-weight: 700;
      line-height: 1.4;
      margin: 0;
      color: var(--text);
    }

    .post-excerpt {
      font-size: 0.95em;
      color: var(--muted);
      line-height: 1.5;
      flex: 1;
    }

    .post-meta {
      display: flex;
      gap: 12px;
      font-size: 0.85em;
      color: var(--muted);
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    /* ========== SIDEBAR ========== */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .sidebar-widget {
      background: var(--bg-alt);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 20px;
    }

    .sidebar-title {
      font-size: 1.15em;
      font-weight: 700;
      margin: 0 0 16px 0;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--orange);
      color: var(--text);
    }

    .sidebar-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar-list li {
      margin-bottom: 12px;
    }

    .sidebar-list a {
      display: block;
      padding: 10px 0;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.95em;
      border-bottom: 1px solid var(--line);
      transition: all 0.2s ease;
    }

    .sidebar-list li:last-child a {
      border-bottom: none;
    }

    .sidebar-list a:hover {
      color: var(--orange);
      padding-left: 8px;
    }

    /* ========== PAGINATION ========== */
    .pagination {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 50px;
      align-items: center;
    }

    .pagination a,
    .pagination button {
      padding: 8px 12px;
      border: 1px solid var(--line);
      background: var(--bg-alt);
      color: var(--text);
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
    }

    .pagination a:hover,
    .pagination button:hover {
      border-color: var(--orange);
      color: var(--orange);
    }

    .pagination .active {
      background: var(--orange);
      color: white;
      border-color: var(--orange);
    }

    /* ========== AD SLOT ========== */
    .ad-slot {
      background: var(--bg-alt);
      border: 2px dashed var(--line);
      border-radius: 10px;
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9em;
      margin: 30px 0;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 768px) {
      .hero-content h1 {
        font-size: 2em;
      }

      .posts-grid {
        grid-template-columns: 1fr;
      }

      .featured-post {
        grid-template-columns: 1fr;
        height: auto;
      }
    }
  </style>
</head>

  <script src="../assets/main.js"></script>

  <script>
    // ========== BLOG DATA STRUCTURE ========== 
    // EDIT THIS SECTION TO ADD YOUR POSTS

    const POSTS = [
      {
        id: 1,
        title: "7 Ways to Reduce Fee Defaults Without Awkward Follow-Up Calls",
        excerpt: "Practical, low-friction changes schools can make to fee reminders and collection — none of which involve chasing parents by phone every month.",
        image: "https://res.cloudinary.com/vosr6w5p/image/upload/v1789730156/SmartSelect_20260915_153813_Chrome.jpg",
        category: "fee-management",
        categoryLabel: "Fee Management",
        file: "reduce-fee-defaults.html",
        readTime: "6 min read",
        featured: true,
        date: "2025-01-15"
      },
      {
        id: 2,
        title: "Why Digital Attendance Saves More Than Just Time",
        excerpt: "Beyond speed — how switching from registers to digital attendance changes parent communication, record accuracy and exam eligibility tracking.",
        image: "https://res.cloudinary.com/vosr6w5p/image/upload/v1789730241/SmartSelect_20260915_154638_Chrome.jpg",
        category: "attendance",
        categoryLabel: "Attendance",
        file: "digital-attendance-benefits.html",
        readTime: "5 min read",
        featured: false,
        date: "2025-01-14"
      },
      {
        id: 3,
        title: "The Result-Day Checklist Every Exam Coordinator Should Have",
        excerpt: "A step-by-step checklist for a calmer result day — from marks verification to report card generation, without the usual last-minute scramble.",
        image: "https://res.cloudinary.com/vosr6w5p/image/upload/v1789730216/SmartSelect_20260915_154243_Chrome.jpg",
        category: "exams",
        categoryLabel: "Exams & Results",
        file: "exam-result-day-checklist.html",
        readTime: "7 min read",
        featured: false,
        date: "2025-01-13"
      },
      // ADD MORE POSTS HERE
      // {
      //   id: 4,
      //   title: "Your Post Title",
      //   excerpt: "Post excerpt...",
      //   image: "image-url",
      //   category: "category-slug",
      //   categoryLabel: "Category Name",
      //   file: "post-file.html",
      //   readTime: "X min read",
      //   featured: false,
      //   date: "2025-01-12"
      // }
    ];

    const POSTS_PER_PAGE = 6;
    let currentPage = 1;
    let selectedCategory = "all";
    let filteredPosts = POSTS;

    // ========== RENDER FUNCTIONS ==========
    function getFilteredPosts() {
      if (selectedCategory === "all") {
        return POSTS.sort((a, b) => new Date(b.date) - new Date(a.date));
      }
      return POSTS.filter(p => p.category === selectedCategory).sort((a, b) => new Date(b.date) - new Date(a.date));
    }

    function renderPosts() {
      filteredPosts = getFilteredPosts();
      currentPage = 1;
      
      const startIdx = (currentPage - 1) * POSTS_PER_PAGE;
      const endIdx = startIdx + POSTS_PER_PAGE;
      const paginatedPosts = filteredPosts.slice(startIdx, endIdx);

      const postsGrid = document.getElementById("postsGrid");
      postsGrid.innerHTML = paginatedPosts.map(post => `
        <a href="${post.file}" class="post-card">
          <img src="${post.image}" alt="${post.title}" class="post-thumbnail">
          <div class="post-body">
            <span class="post-tag">${post.categoryLabel}</span>
            <h3 class="post-title">${post.title}</h3>
            <p class="post-excerpt">${post.excerpt}</p>
            <div class="post-meta">
              <span>${post.readTime}</span>
              <span>•</span>
              <span>${post.categoryLabel}</span>
            </div>
          </div>
        </a>
      `).join("");

      renderPagination();
      renderFeatured();
    }

    function renderFeatured() {
      const featuredPost = POSTS.find(p => p.featured) || POSTS[0];
      if (!featuredPost) return;

      const featured = document.getElementById("featuredPost");
      featured.querySelector(".featured-image").src = featuredPost.image;
      featured.querySelector(".featured-image").alt = featuredPost.title;
      featured.querySelector(".featured-tag").textContent = featuredPost.categoryLabel;
      featured.querySelector(".featured-title").textContent = featuredPost.title;
      featured.querySelector(".featured-excerpt").textContent = featuredPost.excerpt;
      featured.querySelector(".read-time").textContent = featuredPost.readTime;
      featured.querySelector(".category-name").textContent = featuredPost.categoryLabel;
      featured.href = featuredPost.file;
      featured.style.display = "grid";
    }

    function renderPagination() {
      const totalPages = Math.ceil(filteredPosts.length / POSTS_PER_PAGE);
      const pagination = document.getElementById("pagination");
      
      let html = "";
      
      if (currentPage > 1) {
        html += `<a href="#" onclick="goToPage(${currentPage - 1})">← Previous</a>`;
      }

      for (let i = 1; i <= totalPages; i++) {
        if (i === currentPage) {
          html += `<button class="active">${i}</button>`;
        } else {
          html += `<a href="#" onclick="goToPage(${i})">${i}</a>`;
        }
      }

      if (currentPage < totalPages) {
        html += `<a href="#" onclick="goToPage(${currentPage + 1})">Next →</a>`;
      }

      pagination.innerHTML = html;
    }

    function renderRecentPosts() {
      const sorted = POSTS.sort((a, b) => new Date(b.date) - new Date(a.date));
      const recentList = document.getElementById("recentPostsList");
      
      recentList.innerHTML = sorted.slice(0, 5).map(post => `
        <li>
          <a href="${post.file}">${post.title}</a>
        </li>
      `).join("");
    }

    function renderCategories() {
      const categories = [...new Map(POSTS.map(p => [p.category, p.categoryLabel])).entries()];
      const categoriesList = document.getElementById("categoriesList");
      
      categoriesList.innerHTML = categories.map(([slug, label]) => `
        <li>
          <a href="#" onclick="filterByCategory('${slug}')">${label}</a>
        </li>
      `).join("");
    }

    // ========== EVENT HANDLERS ==========
    function filterByCategory(category) {
      selectedCategory = category;
      document.querySelectorAll(".category-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.category === category);
      });
      renderPosts();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function goToPage(page) {
      currentPage = page;
      renderPosts();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return false;
    }

    // Search functionality
    document.getElementById("searchInput").addEventListener("input", (e) => {
      const query = e.target.value.toLowerCase();
      if (query === "") {
        renderPosts();
        return;
      }

      filteredPosts = POSTS.filter(p => 
        p.title.toLowerCase().includes(query) ||
        p.excerpt.toLowerCase().includes(query) ||
        p.categoryLabel.toLowerCase().includes(query)
      ).sort((a, b) => new Date(b.date) - new Date(a.date));

      currentPage = 1;
      const postsGrid = document.getElementById("postsGrid");
      const startIdx = 0;
      const endIdx = POSTS_PER_PAGE;
      const paginatedPosts = filteredPosts.slice(startIdx, endIdx);

      postsGrid.innerHTML = paginatedPosts.map(post => `
        <a href="${post.file}" class="post-card">
          <img src="${post.image}" alt="${post.title}" class="post-thumbnail">
          <div class="post-body">
            <span class="post-tag">${post.categoryLabel}</span>
            <h3 class="post-title">${post.title}</h3>
            <p class="post-excerpt">${post.excerpt}</p>
            <div class="post-meta">
              <span>${post.readTime}</span>
              <span>•</span>
              <span>${post.categoryLabel}</span>
            </div>
          </div>
        </a>
      `).join("");

      renderPagination();
    });

    // Category button clicks
    document.querySelectorAll(".category-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        filterByCategory(btn.dataset.category);
      });
    });

    // ========== INITIAL RENDER ==========
    document.addEventListener("DOMContentLoaded", () => {
      renderPosts();
      renderRecentPosts();
      renderCategories();
    });
  </script>
</body>
